
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22242A"/>
      <stop offset="100%" stop-color="#0C0D10"/>
    </linearGradient>

    <linearGradient id="mark" x1="130" y1="150" x2="380" y2="365">
      <stop offset="0%" stop-color="#F5F3ED"/>
      <stop offset="100%" stop-color="#BFC4CF"/>
    </linearGradient>

    <linearGradient id="chart" x1="50" y1="400" x2="460" y2="140"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#78B99A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#83DDB1" stop-opacity="0.65"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#background)"/>

  <!-- Faint chart grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="2">
    <path d="M70 150 H442"/>
    <path d="M70 220 H442"/>
    <path d="M70 290 H442"/>
    <path d="M70 360 H442"/>
  </g>

  <!-- Stock-style movement: volatility, dips, and upward direction -->
  <path d="M66 350
           L111 319
           L146 339
           L183 269
           L218 294
           L254 226
           L286 252
           L325 190
           L356 211
           L395 151
           L444 119"
        fill="none"
        stroke="url(#chart)"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- LM monogram -->
  <path d="M137 156
           V356
           H263
           M263 356
           V156
           L326 249
           L389 156
           V356"
        fill="none"
        stroke="url(#mark)"
        stroke-width="25"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Forward momentum accent -->
  <path d="M302 310 L326 286 L350 310"
        fill="none"
        stroke="#A9B8D0"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
